[package]
name = "mouseutility"
version = "0.3.0"
edition = "2021"
description = "A terminal mouse utility for Windows: see your Logitech receivers and mice — battery, DPI, report rate — and set DPI and report rate from a beautiful TUI."
license = "MIT"
repository = "https://github.com/viorizz/mouseutility"

[dependencies]
utility-core = { git = "https://github.com/viorizz/utility-core", tag = "v0.1.1" }
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hidapi = "2"
thiserror = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
